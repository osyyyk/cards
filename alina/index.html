<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иван + Анна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1a1220;
    --bg2:#2b1b2e;
    --card:#fffaf3;
    --ink:#2a1f2b;
    --accent:#c96f8a;
    --muted:#8a7a86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 600px at 20% 0%, var(--bg2), var(--bg1) 60%);
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px;
    overflow-x:hidden;
  }
  /* мягкое свечение на фоне */
  body::before{
    content:"";
    position:fixed;
    inset:-20%;
    background:
      radial-gradient(400px 400px at 15% 20%, rgba(201,111,138,.25), transparent 70%),
      radial-gradient(500px 500px at 85% 80%, rgba(120,90,200,.20), transparent 70%);
    filter:blur(20px);
    z-index:0;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(24px) scale(.98)}
    to{opacity:1; transform:none}
  }

  .card{
    background:var(--card);
    border-radius:28px;
    padding:18px 18px 26px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.55),
      0 10px 20px -10px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.7);
    position:relative;
    overflow:hidden;
  }
  /* тонкая «золотая» рамка */
  .card::after{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(201,111,138,.35);
    border-radius:20px;
    pointer-events:none;
  }

  .photo{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    border-radius:18px;
    display:block;
    background:#eee;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
  }

  .names{
    font-family:'Caveat',cursive;
    font-size:clamp(30px,7vw,44px);
    line-height:1.05;
    text-align:center;
    margin:18px 0 4px;
    color:var(--ink);
  }
  .names span{color:var(--accent)}

  .date{
    text-align:center;
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }

  .phrase{
    text-align:center;
    font-size:15px;
    line-height:1.55;
    color:#4a3d48;
    padding:0 8px;
  }

  .divider{
    display:flex;align-items:center;gap:12px;
    margin:18px auto 16px;max-width:220px;color:var(--accent);
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(201,111,138,.5),transparent);
  }
  .divider svg{width:16px;height:16px;flex:none}

  .actions{
    display:flex;gap:10px;justify-content:center;margin-top:6px;
  }
  .btn{
    appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;
    padding:11px 18px;border-radius:999px;
    background:var(--accent);color:#fff;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 8px 20px -8px rgba(201,111,138,.8);
  }
  .btn:hover{transform:translateY(-1px);background:#b85d79}
  .btn:active{transform:translateY(0)}
  .btn.ghost{
    background:transparent;color:var(--accent);
    box-shadow:inset 0 0 0 1.5px rgba(201,111,138,.5);
  }

  .footer{
    text-align:center;
    color:rgba(255,255,255,.45);
    font-size:12px;
    margin-top:18px;
    letter-spacing:.05em;
  }

  /* плавающие сердечки */
  .hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .hearts i{
    position:absolute;bottom:-40px;
    width:10px;height:10px;
    background:var(--accent);
    opacity:.0;
    border-radius:50%;
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translateY(0) scale(.6);opacity:0}
    15%{opacity:.35}
    100%{transform:translateY(-110vh) scale(1.1);opacity:0}
  }

  @media (prefers-reduced-motion: reduce){
    .wrap{animation:none}
    .hearts{display:none}
  }
</style>
</head>
<body>

<div class="hearts" aria-hidden="true">
  <i style="left:10%;animation-duration:14s;animation-delay:0s"></i>
  <i style="left:25%;animation-duration:18s;animation-delay:2s"></i>
  <i style="left:45%;animation-duration:16s;animation-delay:5s"></i>
  <i style="left:65%;animation-duration:20s;animation-delay:1s"></i>
  <i style="left:80%;animation-duration:15s;animation-delay:4s"></i>
  <i style="left:92%;animation-duration:19s;animation-delay:7s"></i>
</div>

<main class="wrap">
  <article class="card">
    <img class="photo" src="index.jpg" alt="Наша фотография">

    <h1 class="names">Иван <span>+</span> Анна</h1>
    <p class="date">с 14 февраля 2022</p>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.2C.8 8.4 2.3 5 5.6 5c2 0 3.3 1.1 4.4 2.6C11.1 6.1 12.4 5 14.4 5c3.3 0 4.8 3.4 3.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <p class="phrase">Каждый день с тобой — как этот тост: просто, тепло и всегда хочется ещё.</p>

    <div class="actions">
      <button class="btn" id="share">Поделиться</button>
      <button class="btn ghost" id="save">Сохранить фото</button>
    </div>
  </article>

  <p class="footer">сделано с любовью · отсканируй и улыбнись</p>
</main>

<script>
  // Кнопка «Поделиться»
  document.getElementById('share').addEventListener('click', async () => {
    const data = {
      title: document.title,
      text: 'Наша открытка ❤️',
      url: location.href
    };
    if (navigator.share) {
      try { await navigator.share(data); } catch(e){}
    } else {
      try {
        await navigator.clipboard.writeText(location.href);
        alert('Ссылка скопирована!');
      } catch(e) {
        prompt('Скопируй ссылку:', location.href);
      }
    }
  });

  // Кнопка «Сохранить фото»
  document.getElementById('save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = 'index.jpg';
    a.download = document.title.replace(/\s+/g,'-') + '.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
</script>

</body>
</html>
