<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Иван + Анна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1a1220; --bg2:#2b1b2e;
    --paper:#fffaf3; --ink:#2a1f2b;
    --accent:#c96f8a; --muted:#8a7a86;
    --env1:#f7e9ee; --env2:#efd3dd; --env3:#e7bfcd;
    --seal1:#e08aa3; --seal2:#c96f8a; --seal3:#a94f68;
    --hint:#8a4b60;
    --border:rgba(201,111,138,.35);
    --shadow: 0 20px 40px -15px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 600px at 20% 0%, var(--bg2), var(--bg1) 60%);
    min-height:100dvh;display:grid;place-items:center;
    padding:16px;overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:420px;
    height:100%;
    max-height: 850px;
    perspective:1200px;
    display:grid;
    place-items:center;
  }

  /* ================= КОНВЕРТ ================= */
  .envelope{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.4,0,.2,1), opacity .4s ease;
    /* Усилили анимацию: теперь конверт заметно летает и наклоняется */
    animation: floaty 3s ease-in-out infinite;
    border-radius: 24px;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotateZ(-2deg) scale(1)}
    50%{transform:translateY(-15px) rotateZ(2deg) scale(1.02)}
  }

  .env-body{
    position:absolute;
    inset:0;
    background:linear-gradient(160deg,var(--env1),var(--env3));
    border-radius:24px;
    box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.6);
    overflow:hidden;
  }
  
  .env-body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 40%, var(--env2));
    clip-path:polygon(0 100%, 50% 50%, 100% 100%);
  }

  .flap{
    position:absolute;
    left:0;right:0;top:0;
    height:60%;
    transform-origin:top center;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,0,.2,1); /* Ускорили открытие клапана */
    z-index:5;
  }
  .flap-front, .flap-back{
    position:absolute;inset:0;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-radius:24px 24px 0 0;
    backface-visibility:hidden;
  }
  .flap-front{
    background:linear-gradient(180deg,var(--env1),var(--env2));
    box-shadow:inset 0 -10px 20px -10px rgba(0,0,0,.15);
  }
  .flap-back{
    background:linear-gradient(180deg,var(--env2),var(--env3));
    transform:rotateX(180deg);
  }

  .seal{
    position:absolute;
    left:50%; top:50%;
    width:70px; height:70px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 35%, var(--seal1), var(--seal2) 60%, var(--seal3));
    border-radius:50%;
    display:grid;place-items:center;
    color:#fff;
    box-shadow:0 8px 16px -4px rgba(169,79,104,.8), inset 0 -3px 6px rgba(0,0,0,.2);
    z-index:6;
    /* Печать теперь пульсирует быстрее и заметнее */
    animation:pulse 1.5s ease-in-out infinite;
    transition:opacity .2s ease, transform .2s ease;
  }
  @keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.15)}
  }

  .heart {
    width: 24px; height: 24px;
    background-color: #fff;
    position: relative;
    transform: rotate(-45deg);
    margin-top: -4px;
  }
  .heart::before, .heart::after {
    content: "";
    width: 24px; height: 24px;
    background-color: #fff;
    border-radius: 50%;
    position: absolute;
  }
  .heart::before { top: -12px; left: 0; }
  .heart::after { top: 0; left: 12px; }

  .open-hint{
    position:absolute;
    left:0;right:0;bottom:20px;
    text-align:center;
    font-family:'Caveat',cursive;
    font-size:clamp(24px,6vw,32px);
    color:var(--hint);
    z-index:3;
    /* Текст тоже качается активнее */
    animation:wobble 1.5s ease-in-out infinite;
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-4deg) scale(1)}
    50%{transform:rotate(4deg) scale(1.05)}
  }
  .open-hint::after{ content:" ✦"; color:var(--accent); }

  /* ================= ОТКРЫТКА ================= */
  .card{
    position:absolute;
    inset:0;
    background:var(--paper);
    border-radius:24px;
    padding:12px 12px 16px; 
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8);
    opacity:0;
    /* Теперь открытка вылетает снизу с отскоком */
    transform:translateY(100px) scale(.85);
    pointer-events:none;
    transition:opacity .4s ease, transform .6s cubic-bezier(.34,1.56,.64,1); /* Пружинистая анимация */
    overflow:hidden;
    z-index:2;
    display: flex;
    flex-direction: column;
  }
  .card::after{
    content:"";position:absolute;inset:6px;
    border:1px solid var(--border);border-radius:18px;pointer-events:none;
  }
  
  .photo-wrapper {
    flex: 1;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #eee;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo{
    width:100%; 
    height:100%;
    object-fit: cover; 
    display:block;
  }

  .names{
    font-family:'Caveat',cursive;
    font-size:clamp(24px,6vw,32px);
    line-height:1;
    text-align:center;
    margin:10px 0 6px;
    color:var(--ink);
    flex-shrink: 0;
  }
  .names span{color:var(--accent)}

  .start{
    text-align:center;
    margin:0 auto 6px;
    padding:6px 10px;
    background:linear-gradient(180deg,rgba(201,111,138,.08),rgba(201,111,138,.02));
    border-radius:10px;
    border:1px dashed var(--border);
    width: 90%;
    flex-shrink: 0;
  }
  .start-label{
    font-size:9px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:2px;
  }
  .start-date{
    font-family:'Caveat',cursive;font-size:clamp(18px,4vw,22px);
    color:var(--ink);line-height:1.1;
  }
  .start-days{margin-top:2px;font-size:11px;color:var(--muted)}
  .start-days b{color:var(--accent);font-weight:600;font-size:13px}

  .phrase{
    text-align:center;font-size:12px;line-height:1.4;
    color:var(--ink);opacity:.85;padding:0 8px;
    flex-shrink: 0;
    margin-bottom: 2px;
  }

  /* ================= СОСТОЯНИЕ ОТКРЫТО ================= */
  .stage.opened .flap{ transform:rotateX(180deg); }
  .stage.opened .seal{ opacity:0; transform:translate(-50%,-50%) scale(.2); animation:none; }
  .stage.opened .open-hint{ opacity:0; }
  
  .stage.opened .envelope{
    animation:none;
    /* Конверт быстро улетает вниз и растворяется */
    transform:translateY(80px) scale(.8) rotateX(20deg);
    opacity:0; pointer-events:none;
    transition:transform .5s cubic-bezier(.4,0,1,1), opacity .4s ease .2s;
  }
  
  .stage.opened .card{
    opacity:1; pointer-events:auto;
    /* Открытка встает на место с пружинкой */
    transform:none;
    transition:opacity .4s ease .2s, transform .6s cubic-bezier(.34,1.56,.64,1) .2s;
  }

  /* Текст появляется быстрее и резче */
  .reveal{opacity:0; transform:translateY(15px); transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.56,.64,1)}
  .stage.opened .reveal{opacity:1; transform:none}
  .stage.opened .r1{transition-delay:.5s}
  .stage.opened .r2{transition-delay:.6s}
  .stage.opened .r3{transition-delay:.7s}
  .stage.opened .r4{transition-delay:.8s}

</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- КОНВЕРТ -->
  <div class="envelope" id="envelope">
    <div class="env-body"></div>
    <div class="flap">
      <div class="flap-front"></div>
      <div class="flap-back"></div>
    </div>
    <div class="seal">
      <div class="heart"></div>
    </div>
    <div class="open-hint">открой меня</div>
  </div>

  <!-- ОТКРЫТКА -->
  <div class="card">
    <div class="photo-wrapper reveal r1">
      <img class="photo" src="index.JPG" alt="Фото">
    </div>
    
    <h1 class="names reveal r2">Иван <span>+</span> Анна</h1>
    
    <div class="start reveal r3">
      <div class="start-label">начало нашей истории</div>
      <div class="start-date">14 февраля 2022</div>
      <div class="start-days">вместе уже <b id="days">…</b></div>
    </div>
    
    <p class="phrase reveal r4">Каждый день с тобой — как этот тост: просто, тепло и всегда хочется ещё.</p>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const envelope = document.getElementById('envelope');

  envelope.addEventListener('click', () => {
    if (!stage.classList.contains('opened')) {
      stage.classList.add('opened');
    }
  });

  // СЧЕТЧИК
  const START_DATE = new Date(2022, 1, 14); // Февраль = 1

  function plural(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'день';
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'дня';
    return 'дней';
  }

  function updateDays() {
    const days = Math.floor((new Date() - START_DATE) / 86400000);
    document.getElementById('days').textContent = days + ' ' + plural(days);
  }
  
  updateDays();
</script>
</body>
</html>
