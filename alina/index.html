<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иван + Анна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1a1220; --bg2:#2b1b2e;
    --paper:#fffaf3; --ink:#2a1f2b;
    --accent:#c96f8a; --muted:#8a7a86;
    --env1:#f7e9ee; --env2:#efd3dd; --env3:#e7bfcd;
    --seal1:#e08aa3; --seal2:#c96f8a; --seal3:#a94f68;
    --hint:#8a4b60;
    --glow1:rgba(201,111,138,.28);
    --glow2:rgba(120,90,200,.22);
    --footer:rgba(255,255,255,.45);
    --border:rgba(201,111,138,.35);
  }
  html[data-theme="pastel"]{
    --bg1:#fdf6f0; --bg2:#f6e7ee;
    --paper:#ffffff; --ink:#3a2c38;
    --accent:#d98aa3; --muted:#a08c98;
    --env1:#fdeef3; --env2:#f8d9e3; --env3:#f1c3d3;
    --seal1:#f0a7bd; --seal2:#d98aa3; --seal3:#c2708b;
    --hint:#b56a83;
    --glow1:rgba(217,138,163,.35);
    --glow2:rgba(180,160,230,.30);
    --footer:rgba(90,70,85,.45);
    --border:rgba(217,138,163,.45);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 600px at 20% 0%, var(--bg2), var(--bg1) 60%);
    min-height:100dvh;display:grid;place-items:center;padding:24px;
    overflow:hidden;transition:background .6s ease, color .6s ease;
  }
  body::before{
    content:"";position:fixed;inset:-20%;
    background:
      radial-gradient(400px 400px at 15% 20%, var(--glow1), transparent 70%),
      radial-gradient(500px 500px at 85% 80%, var(--glow2), transparent 70%);
    filter:blur(20px);z-index:0;pointer-events:none;transition:background .6s ease;
  }

  /* ---------- СЦЕНА: фиксированная высота, всё внутри ---------- */
  .stage{
    position:relative;z-index:1;
    width:100%;max-width:440px;
    height:560px;                 /* стабильная высота */
    perspective:1600px;
    display:grid;place-items:center;
  }

  /* ---------- КОНВЕРТ ---------- */
  .envelope{
    position:absolute;inset:0;
    width:100%;height:100%;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
    animation:floaty 5s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotateZ(-.4deg)}
    50%{transform:translateY(-8px) rotateZ(.4deg)}
  }

  .env-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,var(--env1),var(--env3));
    border-radius:22px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.55),
               0 18px 30px -18px rgba(0,0,0,.4),
               inset 0 1px 0 rgba(255,255,255,.6);
    overflow:hidden;
  }
  .env-body::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 55%, var(--env2));
    clip-path:polygon(0 100%,50% 55%,100% 100%);
  }

  /* клапан */
  .flap{
    position:absolute;left:0;right:0;top:0;height:62%;
    transform-origin:top center;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.4,0,.2,1);
    z-index:4;
  }
  .flap-face,
  .flap-back{
    position:absolute;inset:0;
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:22px 22px 0 0;
    backface-visibility:hidden;
  }
  .flap-face{
    background:linear-gradient(180deg,var(--env1),var(--env2));
    box-shadow:inset 0 -12px 24px -12px rgba(0,0,0,.15);
  }
  .flap-back{
    background:linear-gradient(180deg,var(--env2),var(--env3));
    transform:rotateX(180deg);
    box-shadow:inset 0 12px 24px -12px rgba(0,0,0,.2);
  }

  /* печать */
  .seal{
    position:absolute;left:50%;top:52%;width:72px;height:72px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 30% 30%,var(--seal1),var(--seal2) 60%,var(--seal3));
    border-radius:50%;display:grid;place-items:center;color:#fff;
    box-shadow:0 12px 24px -8px rgba(169,79,104,.9),
               inset 0 -4px 8px rgba(0,0,0,.2),
               inset 0 4px 6px rgba(255,255,255,.35);
    z-index:6;
    animation:pulse 2.4s ease-in-out infinite;
    transition:opacity .3s ease, transform .3s ease;
  }
  @keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.06)}
  }
  .seal svg{width:28px;height:28px}

  .open-hint{
    position:absolute;left:0;right:0;bottom:16px;text-align:center;
    font-family:'Caveat',cursive;font-size:clamp(22px,5.4vw,30px);
    color:var(--hint);letter-spacing:.5px;z-index:3;
    animation:wobble 2.6s ease-in-out infinite;
    transition:opacity .3s ease;
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-2deg)}
    50%{transform:rotate(2deg)}
  }
  .open-hint::after{content:" ✦";color:var(--accent);animation:blink 1.4s steps(1) infinite}
  @keyframes blink{50%{opacity:.2}}

  /* ---------- ОТКРЫТКА ---------- */
  .card{
    position:absolute;inset:0;
    background:var(--paper);border-radius:24px;
    padding:16px 16px 22px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.8);
    opacity:0;
    transform:translateY(30px) scale(.95);
    pointer-events:none;
    transition:opacity .5s ease, transform .7s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;z-index:2;
  }
  .card::after{
    content:"";position:absolute;inset:9px;
    border:1px solid var(--border);border-radius:18px;pointer-events:none;
  }
  .photo{
    width:100%;height:52%;
    object-fit:cover;border-radius:16px;display:block;background:#eee;
  }
  .names{
    font-family:'Caveat',cursive;font-size:clamp(28px,6.4vw,40px);
    line-height:1.05;text-align:center;margin:14px 0 2px;
  }
  .names span{color:var(--accent)}

  .start{
    text-align:center;margin:6px 0 12px;padding:10px 10px;
    background:linear-gradient(180deg,var(--glow1),transparent);
    border-radius:14px;border:1px dashed var(--border);
  }
  .start-label{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:3px;
  }
  .start-date{
    font-family:'Caveat',cursive;font-size:clamp(20px,5vw,26px);
    color:var(--ink);line-height:1.1;
  }
  .start-days{margin-top:4px;font-size:13px;color:var(--muted)}
  .start-days b{color:var(--accent);font-weight:600;font-size:15px}

  .phrase{
    text-align:center;font-size:14px;line-height:1.5;
    color:var(--ink);opacity:.85;padding:0 8px;
  }
  .divider{
    display:flex;align-items:center;gap:10px;
    margin:12px auto 10px;max-width:200px;color:var(--accent);
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--border),transparent);
  }
  .divider svg{width:15px;height:15px;flex:none}

  /* ---------- ОТКРЫТО ---------- */
  .stage.opened .flap{
    transform:rotateX(180deg);
  }
  .stage.opened .seal{
    opacity:0;transform:translate(-50%,-50%) scale(.4);
    animation:none;
  }
  .stage.opened .open-hint{opacity:0}
  .stage.opened .envelope{
    animation:none;
    transform:translateY(40px) scale(.94);
    opacity:0;
    pointer-events:none;
    transition:transform .9s cubic-bezier(.2,.8,.2,1) .2s, opacity .5s ease .5s;
  }
  .stage.opened .card{
    opacity:1;pointer-events:auto;
    transform:none;
    transition:opacity .5s ease .55s, transform .8s cubic-bezier(.2,.8,.2,1) .55s;
  }

  .card .reveal{opacity:0;transform:translateY(10px);transition:opacity .5s ease, transform .5s ease}
  .stage.opened .card .reveal{opacity:1;transform:none}
  .stage.opened .card .r1{transition-delay:1.0s}
  .stage.opened .card .r2{transition-delay:1.15s}
  .stage.opened .card .r3{transition-delay:1.3s}
  .stage.opened .card .r4{transition-delay:1.45s}
  .stage.opened .card .r5{transition-delay:1.6s}

  .theme-btn{
    position:fixed;top:16px;right:16px;z-index:10;
    width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;
    backdrop-filter:blur(8px);
    display:grid;place-items:center;font-size:18px;
    transition:background .3s ease, transform .2s ease;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.4);
  }
  html[data-theme="pastel"] .theme-btn{background:rgba(0,0,0,.06);color:#8a4b60}
  .theme-btn:hover{transform:scale(1.06)}

  .footer{
    position:fixed;left:0;right:0;bottom:14px;text-align:center;
    color:var(--footer);font-size:12px;letter-spacing:.05em;z-index:1;
  }

  @media (max-width:480px){
    .stage{height:min(560px, 86vh)}
  }
  @media (prefers-reduced-motion: reduce){
    .envelope,.seal,.open-hint,.open-hint::after{animation:none}
  }
</style>
</head>
<body>

<button class="theme-btn" id="themeBtn" aria-label="Сменить тему">☀</button>

<div class="stage" id="stage">

  <!-- КОНВЕРТ -->
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Открыть открытку">
    <div class="env-body"></div>
    <div class="flap" aria-hidden="true">
      <div class="flap-face"></div>
      <div class="flap-back"></div>
    </div>
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.2C.8 8.4 2.3 5 5.6 5c2 0 3.3 1.1 4.4 2.6C11.1 6.1 12.4 5 14.4 5c3.3 0 4.8 3.4 3.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="open-hint">открой меня</div>
  </div>

  <!-- ОТКРЫТКА -->
  <article class="card" id="card" aria-hidden="true">
    <img class="photo reveal r1" src="index.jpg" alt="Наша фотография">
    <h1 class="names reveal r2">Иван <span>+</span> Анна</h1>

    <div class="start reveal r3">
      <div class="start-label">начало нашей истории</div>
      <div class="start-date">14 февраля 2022</div>
      <div class="start-days">вместе уже <b id="days">…</b></div>
    </div>

    <div class="divider reveal r4" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.2C.8 8.4 2.3 5 5.6 5c2 0 3.3 1.1 4.4 2.6C11.1 6.1 12.4 5 14.4 5c3.3 0 4.8 3.4 3.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
    </div>

    <p class="phrase reveal r5">Каждый день с тобой — как этот тост: просто, тепло и всегда хочется ещё.</p>
  </article>

</div>

<p class="footer">сделано с любовью · отсканируй и улыбнись</p>

<script>
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  html.setAttribute('data-theme','dark');

  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'pastel' : 'dark';
    html.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'dark' ? '☀' : '☾';
  });

  const stage = document.getElementById('stage');
  const envelope = document.getElementById('envelope');
  const card = document.getElementById('card');

  function openCard(){
    if (stage.classList.contains('opened')) return;
    stage.classList.add('opened');
    card.setAttribute('aria-hidden','false');
  }
  envelope.addEventListener('click', openCard);
  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); }
  });

  // МЕНЯЙ ДАТУ (YYYY, MM-1, DD). Февраль = 1.
  const START_DATE = new Date(2022, 1, 14);

  function plural(n, one, few, many){
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }
  function updateDays(){
    const days = Math.floor((new Date() - START_DATE) / 86400000);
    document.getElementById('days').textContent = days + ' ' + plural(days,'день','дня','дней');
  }
  updateDays();
  setInterval(updateDays, 60000);
</script>

</body>
</html>
