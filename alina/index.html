<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иван + Анна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#1a1220;
    --bg2:#2b1b2e;
    --paper:#fffaf3;
    --ink:#2a1f2b;
    --accent:#c96f8a;
    --accent-2:#e8a4b8;
    --muted:#8a7a86;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 600px at 20% 0%, var(--bg2), var(--bg1) 60%);
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px;
    overflow:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:-20%;
    background:
      radial-gradient(400px 400px at 15% 20%, rgba(201,111,138,.28), transparent 70%),
      radial-gradient(500px 500px at 85% 80%, rgba(120,90,200,.22), transparent 70%);
    filter:blur(20px);
    z-index:0;pointer-events:none;
  }

  /* ---------- СЦЕНА ---------- */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    perspective:1400px;
  }

  /* ---------- КОНВЕРТ (закрытое состояние) ---------- */
  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s ease;
    animation:floaty 5s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotateZ(-.5deg)}
    50%{transform:translateY(-10px) rotateZ(.5deg)}
  }

  .env-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,#f7e9ee,#efd3dd 55%,#e7bfcd);
    border-radius:22px;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.7),
      0 18px 30px -18px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.8);
    overflow:hidden;
  }
  /* треугольник-клапан */
  .env-body::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg,#fbeef3,#eccfd9);
    clip-path:polygon(0 0,100% 0,50% 62%);
    box-shadow:inset 0 -12px 24px -12px rgba(0,0,0,.12);
  }
  /* печать-сердечко */
  .seal{
    position:absolute;left:50%;top:50%;
    width:74px;height:74px;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 30% 30%,#e08aa3,#c96f8a 60%,#a94f68);
    border-radius:50%;
    display:grid;place-items:center;
    color:#fff;
    box-shadow:
      0 12px 24px -8px rgba(169,79,104,.9),
      inset 0 -4px 8px rgba(0,0,0,.2),
      inset 0 4px 6px rgba(255,255,255,.35);
    z-index:3;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.07)}
  }
  .seal svg{width:30px;height:30px}

  /* подпись «открой меня» */
  .open-hint{
    position:absolute;left:0;right:0;bottom:18px;
    text-align:center;
    font-family:'Caveat',cursive;
    font-size:clamp(22px,5.4vw,30px);
    color:#8a4b60;
    letter-spacing:.5px;
    z-index:3;
    animation:wobble 2.6s ease-in-out infinite;
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-2deg) translateY(0)}
    50%{transform:rotate(2deg) translateY(-4px)}
  }

  /* точка-искра */
  .open-hint::after{
    content:" ✦";
    color:#c96f8a;
    animation:blink 1.4s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:.2}}

  /* ---------- ОТКРЫТКА (раскрытое состояние) ---------- */
  .card{
    position:absolute;inset:0;
    background:var(--paper);
    border-radius:24px;
    padding:16px 16px 22px;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.8);
    opacity:0;
    transform:translateY(20px) scale(.96);
    pointer-events:none;
    transition:opacity .7s ease .15s, transform .8s cubic-bezier(.2,.8,.2,1) .15s;
    overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;inset:9px;
    border:1px solid rgba(201,111,138,.35);
    border-radius:18px;pointer-events:none;
  }

  .photo{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    border-radius:16px;
    display:block;
    background:#eee;
  }

  .names{
    font-family:'Caveat',cursive;
    font-size:clamp(30px,7vw,44px);
    line-height:1.05;text-align:center;
    margin:16px 0 2px;
  }
  .names span{color:var(--accent)}

  .date{
    text-align:center;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px;
  }

  .phrase{
    text-align:center;font-size:14.5px;line-height:1.55;
    color:#4a3d48;padding:0 8px;
  }

  .divider{
    display:flex;align-items:center;gap:10px;
    margin:14px auto 12px;max-width:200px;color:var(--accent);
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(201,111,138,.5),transparent);
  }
  .divider svg{width:15px;height:15px;flex:none}

  /* ---------- СОСТОЯНИЕ «ОТКРЫТО» ---------- */
  .stage.opened .envelope{
    transform:translateY(-30px) rotateX(18deg) scale(.86);
    opacity:0;
    pointer-events:none;
  }
  .stage.opened .card{
    opacity:1;
    transform:none;
    pointer-events:auto;
  }

  /* поэтапное появление текста */
  .card .reveal{
    opacity:0;transform:translateY(12px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .stage.opened .card .reveal{opacity:1;transform:none}
  .stage.opened .card .r1{transition-delay:.55s}
  .stage.opened .card .r2{transition-delay:.75s}
  .stage.opened .card .r3{transition-delay:.9s}
  .stage.opened .card .r4{transition-delay:1.05s}

  .footer{
    position:fixed;left:0;right:0;bottom:14px;
    text-align:center;color:rgba(255,255,255,.45);
    font-size:12px;letter-spacing:.05em;z-index:1;
  }

  @media (prefers-reduced-motion: reduce){
    .envelope{animation:none}
    .seal{animation:none}
    .open-hint{animation:none}
    .open-hint::after{animation:none}
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- ЗАКРЫТЫЙ КОНВЕРТ -->
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Открыть открытку">
    <div class="env-body"></div>
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.2C.8 8.4 2.3 5 5.6 5c2 0 3.3 1.1 4.4 2.6C11.1 6.1 12.4 5 14.4 5c3.3 0 4.8 3.4 3.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="open-hint">открой меня</div>
  </div>

  <!-- ОТКРЫТКА -->
  <article class="card" id="card" aria-hidden="true">
    <img class="photo reveal r1" src="index.jpg" alt="Наша фотография">
    <h1 class="names reveal r2">Иван <span>+</span> Анна</h1>
    <p class="date reveal r2">с 14 февраля 2022</p>
    <div class="divider reveal r3" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.2C.8 8.4 2.3 5 5.6 5c2 0 3.3 1.1 4.4 2.6C11.1 6.1 12.4 5 14.4 5c3.3 0 4.8 3.4 3.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <p class="phrase reveal r4">Каждый день с тобой — как этот тост: просто, тепло и всегда хочется ещё.</p>
  </article>

</div>

<p class="footer">сделано с любовью · отсканируй и улыбнись</p>

<script>
  const stage = document.getElementById('stage');
  const envelope = document.getElementById('envelope');
  const card = document.getElementById('card');

  function openCard(){
    if (stage.classList.contains('opened')) return;
    stage.classList.add('opened');
    card.setAttribute('aria-hidden','false');
  }

  envelope.addEventListener('click', openCard);
  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); }
  });
</script>

</body>
</html>
